name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      # Real database for tests/db — same pinned image as docker-compose
      db:
        image: timescale/timescaledb:2.19.3-pg14
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Dockerfile.api (python:3.11-slim) — CI must test the
          # runtime that actually ships
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -r requirements-test.txt

      - name: Run tests with coverage (incl. real-SQL suite)
        env:
          SENTINEL_DB_TESTS: "1"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: password
        run: pytest tests/ -v --tb=short --cov=api --cov=fleet_data --cov=ml --cov-report=term-missing

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run tests
        run: npx vitest run

      - name: Lint
        run: npm run lint
