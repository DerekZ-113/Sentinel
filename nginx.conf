server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to FastAPI backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Hashed build assets: safe to cache forever (a redeploy changes the hash)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for client-side routes.
    # no-cache: a stale cached index.html references JS chunk hashes that no
    # longer exist after a redeploy, and the fallback would serve them as
    # 200 text/html — a silent blank page instead of a recoverable 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
